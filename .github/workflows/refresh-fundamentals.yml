name: Refresh lookout fundamentals

on:
  schedule:
    # Earnings + dividends cost 20 credits each (confirmed via Twelve
    # Data's response headers) — refreshing P/E and dividend yield for all
    # 63 symbols needs ~1500 credits (75 calls), which the script's
    # credit-aware pacer legitimately spreads across ~40 real minutes to
    # respect the 55-credit/minute plan limit (at most two 20-credit calls
    # fit in any minute). P/E and yield barely change hour to hour, so
    # weekly is plenty; Sunday 03:00 UTC is a quiet time for the site.
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

# Shares a concurrency group with refresh-prices.yml since both write to
# the same data.json — never run simultaneously with each other.
concurrency:
  group: refresh-lookout-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A full run takes ~40 minutes since it has to pace ~1500 credits'
    # worth of calls against a 55-credit/minute plan limit — results are only
    # committed at the very end, so a timeout mid-run would lose all of it.
    # 60 leaves headroom for API latency and the odd rate-limit retry.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Refresh fundamentals
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          REFRESH_MODE: fundamentals
        run: node .github/scripts/fetch-stock-data.mjs
